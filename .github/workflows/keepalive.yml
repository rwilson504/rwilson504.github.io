name: Keep scheduled workflows active

on:
  schedule:
    # Weekly, with room for delays before GitHub's 60-day inactivity cutoff.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Commit heartbeat after 45 days without a commit
        shell: bash
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date -u +%s)
          idle_seconds=$((now - last_commit))
          threshold_seconds=$((45 * 24 * 60 * 60))

          if (( idle_seconds < threshold_seconds )); then
            echo "Latest commit is less than 45 days old; no heartbeat needed."
            exit 0
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push
