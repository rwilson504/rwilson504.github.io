<?xml version="1.0" encoding="UTF-8"?>
<!--
  FNIRSI 2C53T Interactive Device Diagram
  ========================================
  Every button, port, and the screen is a named <g> element.
  To highlight an element, add class="highlight" to its <g>.

  Element IDs:
    Ports (top):    port-ch1, port-ch2, port-siggen
    Screen:         screen
    Buttons:        btn-move, btn-select, btn-trigger, btn-prm
                    btn-ch1, btn-ch2
                    btn-auto, btn-save
                    btn-up, btn-down, btn-left, btn-right, btn-playpause
                    btn-power, btn-menu
    Ports (bottom): port-10a, port-ma, port-com, port-vohm

  Usage in HTML:
    <object id="meter-svg" data="fnirsi-2c53t-device.svg" type="image/svg+xml"></object>
    <script>
      function highlightMeter(...ids) {
        const svg = document.getElementById('meter-svg').contentDocument;
        svg.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));
        ids.forEach(id => {
          const el = svg.getElementById(id);
          if (el) el.classList.add('highlight');
        });
      }
      // Example: highlightMeter('port-vohm', 'port-com', 'btn-move');
    </script>
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 580" width="300" height="580">
  <title>FNIRSI 2C53T Oscilloscope &amp; Multimeter</title>
  <desc>Interactive diagram of the FNIRSI 2C53T handheld oscilloscope, multimeter, and signal generator. Each control element can be highlighted by adding class="highlight" to its group.</desc>

  <defs>
    <style>
      /* === Base styles === */
      .device-body { fill: #333; }
      .device-top  { fill: #2a2a2a; }
      .device-bot  { fill: #2a2a2a; }
      .grip        { fill: #4a9cd6; }

      .screen-bg   { fill: #111; stroke: #555; stroke-width: 1; }
      .screen-text  { fill: #888; font-family: 'Courier New', monospace; pointer-events: none; }
      .wave-ch1    { stroke: #f0c040; fill: none; stroke-width: 1.5; }
      .wave-ch2    { stroke: #40e880; fill: none; stroke-width: 1.5; }

      .btn         { fill: #3e3e3e; stroke: #555; stroke-width: 0.5; cursor: pointer; }
      .btn:hover   { fill: #4a4a4a; }
      .btn-label   { fill: #bbb; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
      .btn-sub     { fill: #888; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; pointer-events: none; }

      .dpad-bg     { fill: #2e2e2e; }
      .dpad-arrow  { fill: #3a3a3a; stroke: #555; stroke-width: 0.5; cursor: pointer; }
      .dpad-arrow:hover { fill: #4a4a4a; }
      .dpad-center { fill: #3a6fa0; stroke: #4a8fc0; stroke-width: 1; cursor: pointer; }
      .dpad-center:hover { fill: #4a8fc0; }
      .dpad-icon   { fill: #fff; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

      .btn-power-bg   { fill: #b03020; stroke: #802010; stroke-width: 1; cursor: pointer; }
      .btn-power-bg:hover { fill: #d04030; }
      .btn-menu-bg    { fill: #22966e; stroke: #18704e; stroke-width: 1; cursor: pointer; }
      .btn-menu-bg:hover  { fill: #2ab882; }

      .port        { fill: #1a1a1a; stroke: #555; stroke-width: 1; cursor: pointer; }
      .port:hover  { stroke: #888; }
      .port-ring   { fill: none; stroke: #666; stroke-width: 1.5; }
      .port-hole   { fill: #0a0a0a; }
      .port-label  { fill: #bbb; font-family: Arial, Helvetica, sans-serif; font-weight: bold; text-anchor: middle; pointer-events: none; }
      .port-red    { fill: #c0392b; }
      .port-black  { fill: #333; }
      .safety-text { fill: #777; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; pointer-events: none; }
      .brand-text  { fill: #4a9cd6; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; font-weight: bold; pointer-events: none; }

      /* === Highlight state === */
      .highlight > .btn,
      .highlight > .dpad-arrow,
      .highlight > .dpad-center,
      .highlight > .btn-power-bg,
      .highlight > .btn-menu-bg { stroke: #ffe033; stroke-width: 2.5; filter: drop-shadow(0 0 6px rgba(255,224,51,0.7)); }
      .highlight > .port        { stroke: #ffe033; stroke-width: 2.5; filter: drop-shadow(0 0 6px rgba(255,224,51,0.7)); }
      .highlight > .screen-bg   { stroke: #ffe033; stroke-width: 2.5; filter: drop-shadow(0 0 8px rgba(255,224,51,0.5)); }
      .highlight > .btn-label,
      .highlight > .port-label  { fill: #ffe033; }
    </style>

    <!-- Reusable BNC connector shape -->
    <g id="_bnc">
      <circle r="14" class="port"/>
      <circle r="10" class="port-ring"/>
      <circle r="4" class="port-hole"/>
    </g>

    <!-- Reusable banana jack shape -->
    <g id="_banana">
      <circle r="13" class="port"/>
      <circle r="5.5"/>
    </g>
  </defs>

  <!-- ============================================================ -->
  <!-- DEVICE BODY                                                   -->
  <!-- ============================================================ -->
  <g id="device-body">
    <!-- Blue side grips -->
    <rect x="0" y="50" width="22" height="480" rx="11" class="grip"/>
    <rect x="278" y="50" width="22" height="480" rx="11" class="grip"/>
    <!-- Main body -->
    <rect x="14" y="5" width="272" height="570" rx="22" class="device-body"/>
    <!-- Top darker panel -->
    <rect x="14" y="5" width="272" height="55" rx="22" class="device-top"/>
    <rect x="14" y="35" width="272" height="25" class="device-top"/>
    <!-- Bottom darker panel -->
    <rect x="14" y="430" width="272" height="145" rx="22" class="device-bot"/>
    <rect x="14" y="430" width="272" height="25" class="device-bot"/>
  </g>

  <!-- ============================================================ -->
  <!-- TOP PORTS (Oscilloscope + Signal Generator)                   -->
  <!-- ============================================================ -->
  <g id="port-ch1" data-label="Oscilloscope Channel 1 (BNC)">
    <use href="#_bnc" x="75" y="28"/>
    <text x="75" y="52" class="port-label" font-size="7">CH1</text>
  </g>

  <g id="port-ch2" data-label="Oscilloscope Channel 2 (BNC)">
    <use href="#_bnc" x="150" y="28"/>
    <text x="150" y="52" class="port-label" font-size="7">CH2</text>
  </g>

  <g id="port-siggen" data-label="Signal Generator Output (3.5mm jack)">
    <circle cx="228" cy="28" r="8" class="port"/>
    <circle cx="228" cy="28" r="3" class="port-hole"/>
    <text x="228" y="52" class="port-label" font-size="6">SIG GEN</text>
  </g>

  <!-- ============================================================ -->
  <!-- SCREEN                                                        -->
  <!-- ============================================================ -->
  <g id="screen" data-label="2.8 inch LCD display (320×240)">
    <rect x="42" y="62" width="216" height="210" rx="4" class="screen-bg"/>
    <!-- Brand -->
    <text x="52" y="77" class="screen-text" font-size="8" fill="#6ac">FNIRSI</text>
    <text x="248" y="77" class="screen-text" font-size="8" fill="#6ac" text-anchor="end">2C53T</text>
    <!-- Status -->
    <text x="130" y="77" class="screen-text" font-size="7" fill="#4c4" text-anchor="middle">RUN</text>
    <!-- Gridlines (faint) -->
    <line x1="42" y1="167" x2="258" y2="167" stroke="#222" stroke-width="0.3" stroke-dasharray="2,4"/>
    <line x1="150" y1="62" x2="150" y2="272" stroke="#222" stroke-width="0.3" stroke-dasharray="2,4"/>
    <!-- CH1 waveform (yellow) -->
    <path class="wave-ch1" d="M50,140 Q60,100 70,140 Q80,180 90,140 Q100,100 110,140 Q120,180 130,140 Q140,100 150,140 Q160,180 170,140 Q180,100 190,140 Q200,180 210,140 Q220,100 230,140 Q240,180 250,140"/>
    <!-- CH2 waveform (green) -->
    <path class="wave-ch2" d="M50,205 Q60,178 70,205 Q80,232 90,205 Q100,178 110,205 Q120,232 130,205 Q140,178 150,205 Q160,232 170,205 Q180,178 190,205 Q200,232 210,205 Q220,178 230,205 Q240,232 250,205"/>
    <!-- Bottom status bar -->
    <rect x="42" y="258" width="216" height="14" fill="#1a1a1a"/>
    <text x="52" y="268" class="screen-text" font-size="5.5" fill="#f0c040">10V X1 AC</text>
    <text x="150" y="268" class="screen-text" font-size="5.5" fill="#aaa" text-anchor="middle">⏚ Auto ⏚ CH1</text>
    <text x="248" y="268" class="screen-text" font-size="5.5" fill="#40e880" text-anchor="end">10mV X1 AC</text>
  </g>

  <!-- ============================================================ -->
  <!-- FUNCTION BUTTON ROW (MOVE, SELECT, TRIGGER, PRM)              -->
  <!-- ============================================================ -->
  <g id="btn-move" data-label="MOVE — toggle AC/DC, Diode/Continuity">
    <rect x="40" y="286" width="50" height="24" rx="4" class="btn"/>
    <!-- C1 ⇔ C2 icon -->
    <g transform="translate(65, 293)" fill="none" stroke="#bbb" stroke-width="0.7">
      <!-- C1 box -->
      <rect x="-21" y="-5" width="12" height="9" rx="1" stroke="#bbb"/>
      <text x="-15" y="2.5" fill="#bbb" font-family="Arial" font-size="5.5" text-anchor="middle" stroke="none" dominant-baseline="central">C1</text>
      <!-- Double arrow -->
      <line x1="-7" y1="0" x2="7" y2="0"/>
      <polyline points="-4,-2.5 -7,0 -4,2.5"/>
      <polyline points="4,-2.5 7,0 4,2.5"/>
      <!-- C2 box -->
      <rect x="9" y="-5" width="12" height="9" rx="1" stroke="#bbb"/>
      <text x="15" y="2.5" fill="#bbb" font-family="Arial" font-size="5.5" text-anchor="middle" stroke="none" dominant-baseline="central">C2</text>
    </g>
    <text x="65" y="305" class="btn-label" font-size="7">MOVE</text>
  </g>

  <g id="btn-select" data-label="SELECT — toggle d-pad function">
    <rect x="97" y="286" width="50" height="24" rx="4" class="btn"/>
    <!-- Rectangle with 4-way crosshair arrow icon -->
    <g transform="translate(122, 293)" fill="none" stroke="#bbb" stroke-width="0.7">
      <!-- Outer rectangle -->
      <rect x="-11" y="-6" width="22" height="12" rx="1.5"/>
      <!-- Center dot -->
      <circle cx="0" cy="0" r="1" fill="#bbb" stroke="none"/>
      <!-- 4-way arrows -->
      <line x1="0" y1="-4.5" x2="0" y2="4.5"/>
      <line x1="-7" y1="0" x2="7" y2="0"/>
      <polyline points="-1.5,-3 0,-4.5 1.5,-3"/>
      <polyline points="-1.5,3 0,4.5 1.5,3"/>
      <polyline points="-5.5,-1.5 -7,0 -5.5,1.5"/>
      <polyline points="5.5,-1.5 7,0 5.5,1.5"/>
    </g>
    <text x="122" y="305" class="btn-label" font-size="7">SELECT</text>
  </g>

  <g id="btn-trigger" data-label="TRIGGER — trigger settings">
    <rect x="153" y="286" width="50" height="24" rx="4" class="btn"/>
    <!-- Gear/cog icon -->
    <g transform="translate(178, 293)" fill="#bbb" stroke="none">
      <circle cx="0" cy="0" r="3" fill="#3e3e3e" stroke="#bbb" stroke-width="0.7"/>
      <!-- Gear teeth (8 teeth around the circle) -->
      <rect x="-1" y="-6" width="2" height="3" rx="0.5"/>
      <rect x="-1" y="3" width="2" height="3" rx="0.5"/>
      <rect x="-6" y="-1" width="3" height="2" rx="0.5"/>
      <rect x="3" y="-1" width="3" height="2" rx="0.5"/>
      <rect x="-4.8" y="-4.8" width="2" height="2.5" rx="0.5" transform="rotate(45,-3.8,-3.55)"/>
      <rect x="2.8" y="-4.8" width="2" height="2.5" rx="0.5" transform="rotate(-45,3.8,-3.55)"/>
      <rect x="-4.8" y="2.3" width="2" height="2.5" rx="0.5" transform="rotate(-45,-3.8,3.55)"/>
      <rect x="2.8" y="2.3" width="2" height="2.5" rx="0.5" transform="rotate(45,3.8,3.55)"/>
      <circle cx="0" cy="0" r="2" fill="#bbb"/>
      <circle cx="0" cy="0" r="1.2" fill="#3e3e3e"/>
    </g>
    <text x="178" y="305" class="btn-label" font-size="6.5">TRIGGER</text>
  </g>

  <g id="btn-prm" data-label="PRM — parameter selection/display">
    <rect x="210" y="286" width="50" height="24" rx="4" class="btn"/>
    <!-- Parameter slider icon: horizontal line with knob + two shorter lines -->
    <g transform="translate(235, 293)" fill="none" stroke="#bbb" stroke-width="0.8">
      <!-- Top short line -->
      <line x1="-8" y1="-4" x2="8" y2="-4"/>
      <circle cx="-2" cy="-4" r="1.5" fill="#bbb" stroke="none"/>
      <!-- Middle long line (main slider) -->
      <line x1="-10" y1="0" x2="10" y2="0"/>
      <circle cx="4" cy="0" r="2" fill="#bbb" stroke="none"/>
      <!-- Bottom short line -->
      <line x1="-8" y1="4" x2="8" y2="4"/>
      <circle cx="0" cy="4" r="1.5" fill="#bbb" stroke="none"/>
    </g>
    <text x="235" y="305" class="btn-label" font-size="7">PRM</text>
  </g>

  <!-- ============================================================ -->
  <!-- CHANNEL BUTTONS (CH1, CH2)                                    -->
  <!-- ============================================================ -->
  <g id="btn-ch1" data-label="CH1 — channel 1 settings">
    <rect x="38" y="325" width="55" height="32" rx="8" class="btn"/>
    <text x="65" y="344" class="btn-label" font-size="11" font-weight="bold">CH1</text>
  </g>

  <g id="btn-ch2" data-label="CH2 — channel 2 settings">
    <rect x="207" y="325" width="55" height="32" rx="8" class="btn"/>
    <text x="234" y="344" class="btn-label" font-size="11" font-weight="bold">CH2</text>
  </g>

  <!-- ============================================================ -->
  <!-- D-PAD (arrows + center play/pause)                            -->
  <!-- ============================================================ -->
  <!-- D-pad background circle -->
  <circle cx="150" cy="370" r="42" class="dpad-bg"/>

  <g id="btn-up" data-label="Up arrow / range up">
    <polygon points="150,330 166,346 134,346" class="dpad-arrow"/>
    <text x="150" y="341" class="dpad-icon" font-size="8">▲</text>
  </g>

  <g id="btn-down" data-label="Down arrow / range down">
    <polygon points="150,410 166,394 134,394" class="dpad-arrow"/>
    <text x="150" y="403" class="dpad-icon" font-size="8">▼</text>
  </g>

  <g id="btn-left" data-label="Left arrow / switch range left">
    <polygon points="110,370 126,354 126,386" class="dpad-arrow"/>
    <text x="119" y="372" class="dpad-icon" font-size="8">◀</text>
  </g>

  <g id="btn-right" data-label="Right arrow / switch range right">
    <polygon points="190,370 174,354 174,386" class="dpad-arrow"/>
    <text x="181" y="372" class="dpad-icon" font-size="8">▶</text>
  </g>

  <g id="btn-playpause" data-label="Run/Stop — hold/freeze reading">
    <circle cx="150" cy="370" r="18" class="dpad-center"/>
    <text x="150" y="372" class="dpad-icon" font-size="14" font-weight="bold">‖▶</text>
  </g>

  <!-- ============================================================ -->
  <!-- AUTO + SAVE BUTTONS                                           -->
  <!-- ============================================================ -->
  <g id="btn-auto" data-label="AUTO — auto-range / auto-scale">
    <rect x="38" y="365" width="55" height="32" rx="8" class="btn"/>
    <text x="65" y="384" class="btn-label" font-size="11" font-weight="bold">AUTO</text>
  </g>

  <g id="btn-save" data-label="SAVE — screenshot / save data">
    <rect x="207" y="365" width="55" height="32" rx="8" class="btn"/>
    <text x="234" y="384" class="btn-label" font-size="11" font-weight="bold">SAVE</text>
  </g>

  <!-- ============================================================ -->
  <!-- POWER + MENU BUTTONS                                          -->
  <!-- ============================================================ -->
  <g id="btn-power" data-label="Power — short press on/off">
    <circle cx="66" cy="420" r="17" class="btn-power-bg"/>
    <text x="66" y="422" fill="#fff" font-size="16" text-anchor="middle" dominant-baseline="central" pointer-events="none">⏻</text>
  </g>

  <g id="btn-menu" data-label="MENU — long press for home/function selection">
    <rect x="207" y="405" width="55" height="30" rx="8" class="btn-menu-bg"/>
    <text x="234" y="422" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" dominant-baseline="central" font-weight="bold" pointer-events="none">MENU</text>
  </g>

  <!-- ============================================================ -->
  <!-- SAFETY LABELS                                                 -->
  <!-- ============================================================ -->
  <g id="safety-labels" pointer-events="none">
    <!-- 10A label -->
    <text x="82" y="456" class="safety-text" font-size="4.5">10A MAX FUSED</text>
    <text x="82" y="462" class="safety-text" font-size="4.5">250V MAX</text>
    <!-- mA label -->
    <text x="148" y="453" class="safety-text" font-size="4.5">1A MAX</text>
    <text x="148" y="459" class="safety-text" font-size="4.5">FUSED</text>
    <text x="148" y="465" class="safety-text" font-size="4.5">250V MAX</text>
    <!-- VΩ label -->
    <text x="222" y="456" class="safety-text" font-size="4.5">600V CAT IV</text>
    <text x="222" y="462" class="safety-text" font-size="4.5">1000V CAT III</text>
  </g>

  <!-- ============================================================ -->
  <!-- BOTTOM MULTIMETER PORTS                                       -->
  <!-- ============================================================ -->
  <g id="port-10a" data-label="10A port — high current measurement (red lead)">
    <circle cx="58" cy="492" r="14" class="port"/>
    <circle cx="58" cy="492" r="6" class="port-red"/>
    <text x="58" y="518" class="port-label" font-size="10" fill="#c0392b">10A</text>
  </g>

  <g id="port-ma" data-label="mA port — low current measurement (red lead)">
    <circle cx="122" cy="492" r="14" class="port"/>
    <circle cx="122" cy="492" r="6" class="port-red"/>
    <text x="122" y="518" class="port-label" font-size="10" fill="#c0392b">mA</text>
  </g>

  <g id="port-com" data-label="COM port — common/ground (black lead)">
    <circle cx="190" cy="492" r="14" class="port"/>
    <circle cx="190" cy="492" r="6" class="port-black"/>
    <text x="190" y="518" class="port-label" font-size="10">COM</text>
  </g>

  <g id="port-vohm" data-label="VΩ⏚ port — voltage, resistance, capacitance, diode, continuity (red lead)">
    <circle cx="248" cy="492" r="14" class="port"/>
    <circle cx="248" cy="492" r="6" class="port-red"/>
    <text x="248" y="518" class="port-label" font-size="8" fill="#c0392b">VΩ⏚</text>
  </g>

  <!-- ============================================================ -->
  <!-- BOTTOM BRANDING                                               -->
  <!-- ============================================================ -->
  <text x="150" y="550" class="brand-text" font-size="9">Oscilloscope &amp; Multimeter</text>

</svg>
