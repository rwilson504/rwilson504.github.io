<?xml version="1.0" encoding="UTF-8"?>
<!--
  FNIRSI 2C53T — Multimeter Screen SVG
  ======================================
  Editable multimeter display matching the actual screen layout.
  Portrait orientation as shown on the device.

  Editable elements (by ID):
    === Top bar ===
    ref-label        — REF text (top-left, show/hide)
    range-label      — Measurement range/mode text (e.g. "Automatic", "DC voltage", "Resistance")
    hold-label       — HOLD text (show/hide, inside arc)

    === Main reading ===
    reading-value    — Main reading (e.g. "AUTO", "12.65", "0.000")
    reading-unit     — Unit text after reading (e.g. "V", "mA", "KΩ")

    === Mode buttons (add class="mode-active" to highlight in yellow) ===
    mode-v           — Voltage
    mode-cap         — Capacitance / Continuity
    mode-ohm         — Resistance
    mode-diode       — Diode test
    mode-buzz        — Continuity buzzer
    mode-ma          — mA current
    mode-a           — A current

    === Stats bar ===
    stat-max-value   — MAX value text
    stat-mean-value  — MEAN value text
    stat-min-value   — MIN value text

  Usage:
    <object id="mm-screen" data="fnirsi-screen-multimeter.svg"
            type="image/svg+xml" style="width:320px;"></object>
    <script>
      function configureMeter(opts) {
        const svg = document.getElementById('mm-screen').contentDocument;
        if (opts.reading) svg.getElementById('reading-value').textContent = opts.reading;
        if (opts.unit)    svg.getElementById('reading-unit').textContent = opts.unit;
        if (opts.range)   svg.getElementById('range-label').textContent = opts.range;
        if (opts.maxVal)  svg.getElementById('stat-max-value').textContent = opts.maxVal;
        if (opts.meanVal) svg.getElementById('stat-mean-value').textContent = opts.meanVal;
        if (opts.minVal)  svg.getElementById('stat-min-value').textContent = opts.minVal;
        // REF/HOLD visibility
        if ('ref' in opts)  svg.getElementById('ref-label').style.display = opts.ref ? '' : 'none';
        if ('hold' in opts) svg.getElementById('hold-label').style.display = opts.hold ? '' : 'none';
        // Highlight active mode button(s)
        svg.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('mode-active'));
        if (opts.activeMode) {
          opts.activeMode.forEach(m => {
            const el = svg.getElementById('mode-' + m);
            if (el) el.classList.add('mode-active');
          });
        }
      }

      // Example: DC Voltage reading
      configureMeter({
        reading: '12.65', unit: 'V', range: 'DC voltage',
        maxVal: '12.68', meanVal: '12.65', minVal: '12.63',
        hold: false, ref: false, activeMode: ['v']
      });
    </script>
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <title>FNIRSI 2C53T Multimeter Screen</title>

  <defs>
    <style>
      .mm-bg       { fill: #080808; }

      /* Top bar */
      .top-bar-bg  { fill: url(#topBarGrad); }
      .ref-text    { fill: #ccc; font-family: 'Courier New', monospace; font-size: 12px;
                     font-weight: bold; }
      .range-text  { fill: #f0c040; font-family: 'Courier New', monospace; font-size: 15px;
                     font-style: italic; text-anchor: middle; }
      .batt-body   { fill: none; stroke: #888; stroke-width: 1.2; rx: 1; }
      .batt-tip    { fill: #888; }
      .batt-fill   { fill: #4a4; }

      /* Arc gauge */
      .arc-scale   { fill: none; stroke: #c89830; stroke-width: 2; stroke-linecap: round; }
      .arc-tick    { stroke: #888; stroke-width: 0.8; }
      .arc-num     { fill: #c89830; font-family: Arial, Helvetica, sans-serif; font-size: 9px;
                     text-anchor: middle; font-weight: bold; }
      .arc-needle-zone { fill: none; stroke: #444; stroke-width: 1; stroke-dasharray: 4,3; }

      /* HOLD text */
      .hold-text   { fill: #c89830; font-family: Arial, Helvetica, sans-serif; font-size: 16px;
                     font-weight: bold; text-anchor: middle; }

      /* Main reading */
      .reading     { fill: #c89830; font-family: 'Georgia', 'Times New Roman', serif;
                     font-weight: bold; }
      .reading-unit { fill: #c89830; font-family: Arial, Helvetica, sans-serif;
                      font-weight: bold; }

      /* Mode buttons */
      .mode-btn rect { fill: #1a1a1a; stroke: #555; stroke-width: 1; rx: 4; }
      .mode-btn text { fill: #888; font-family: Arial, Helvetica, sans-serif;
                       text-anchor: middle; dominant-baseline: central; font-weight: bold; }
      .mode-btn.mode-active rect { stroke: #c89830; stroke-width: 1.5; }
      .mode-btn.mode-active text { fill: #c89830; }

      /* Stats bar */
      .stats-box   { fill: none; stroke: #444; stroke-width: 1; rx: 6; }
      .stats-div   { stroke: #444; stroke-width: 0.5; }
      .stats-label { fill: #888; font-family: Arial, Helvetica, sans-serif; font-size: 12px;
                     font-weight: bold; text-anchor: middle; }
      .stats-value { fill: #999; font-family: 'Courier New', monospace; font-size: 8px;
                     text-anchor: middle; }
    </style>

    <!-- Top bar gradient (orange-brown) -->
    <linearGradient id="topBarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a4a10"/>
      <stop offset="100%" stop-color="#2a1a08"/>
    </linearGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- BACKGROUND                                                    -->
  <!-- ============================================================ -->
  <rect width="320" height="240" class="mm-bg"/>

  <!-- ============================================================ -->
  <!-- ①② TOP BAR (REF + Range + Battery)                           -->
  <!-- ============================================================ -->
  <rect x="0" y="0" width="320" height="24" class="top-bar-bg"/>

  <!-- ① REF label -->
  <text x="10" y="17" id="ref-label" class="ref-text" style="display:none">REF</text>

  <!-- ② Range / Mode label -->
  <text x="160" y="17" id="range-label" class="range-text">Automatic</text>

  <!-- ③ Battery indicator -->
  <g transform="translate(296, 12)">
    <rect x="-12" y="-6" width="20" height="12" class="batt-body"/>
    <rect x="8" y="-3" width="3" height="6" class="batt-tip" rx="0.5"/>
    <rect x="-10" y="-4" width="16" height="8" class="batt-fill" opacity="0.7"/>
  </g>

  <!-- ============================================================ -->
  <!-- ④ ANALOG ARC GAUGE (0–100 scale)                              -->
  <!-- ============================================================ -->
  <g transform="translate(160, 145)">
    <!-- Main arc (wide semicircle from 0 at bottom-left to 100 at bottom-right) -->
    <path class="arc-scale" d="M-140,10 A 145,145 0 0,1 140,10"/>

    <!-- Tick marks and numbers around the arc -->
    <!-- 0 -->
    <line x1="-140" y1="10" x2="-130" y2="5" class="arc-tick"/>
    <text x="-138" y="-4" class="arc-num">0</text>

    <!-- 10 -->
    <line x1="-138" y1="-18" x2="-128" y2="-16" class="arc-tick"/>
    <text x="-138" y="-24" class="arc-num">10</text>

    <!-- 20 -->
    <line x1="-126" y1="-46" x2="-117" y2="-42" class="arc-tick"/>
    <text x="-128" y="-50" class="arc-num">20</text>

    <!-- 30 -->
    <line x1="-106" y1="-70" x2="-98" y2="-65" class="arc-tick"/>
    <text x="-110" y="-74" class="arc-num">30</text>

    <!-- 40 -->
    <line x1="-80" y1="-90" x2="-73" y2="-84" class="arc-tick"/>
    <text x="-84" y="-94" class="arc-num">40</text>

    <!-- 50 -->
    <line x1="-46" y1="-104" x2="-42" y2="-96" class="arc-tick"/>
    <text x="-48" y="-108" class="arc-num">50</text>

    <!-- 60 -->
    <line x1="-8" y1="-110" x2="-6" y2="-102" class="arc-tick"/>
    <text x="-8" y="-114" class="arc-num">60</text>

    <!-- 70 -->
    <line x1="34" y1="-106" x2="32" y2="-98" class="arc-tick"/>
    <text x="36" y="-110" class="arc-num">70</text>

    <!-- 80 -->
    <line x1="72" y1="-94" x2="67" y2="-87" class="arc-tick"/>
    <text x="76" y="-96" class="arc-num">80</text>

    <!-- 90 -->
    <line x1="106" y1="-72" x2="99" y2="-67" class="arc-tick"/>
    <text x="112" y="-74" class="arc-num">90</text>

    <!-- 100 -->
    <line x1="140" y1="10" x2="130" y2="5" class="arc-tick"/>
    <text x="140" y="-4" class="arc-num">100</text>

    <!-- Needle line (dimmed, no active reading in AUTO) -->
    <line x1="0" y1="20" x2="-120" y2="-10" class="arc-needle-zone" opacity="0.3"/>
  </g>

  <!-- ============================================================ -->
  <!-- ⑤ HOLD LABEL                                                  -->
  <!-- ============================================================ -->
  <text x="195" y="68" id="hold-label" class="hold-text">HOLD</text>

  <!-- ============================================================ -->
  <!-- ⑥ MAIN READING (center)                                       -->
  <!-- ============================================================ -->
  <text x="160" y="148" id="reading-value" class="reading" font-size="64"
        text-anchor="middle" dominant-baseline="central">AUTO</text>
  <text x="275" y="148" id="reading-unit" class="reading-unit" font-size="24"
        dominant-baseline="central"></text>

  <!-- ============================================================ -->
  <!-- ⑦ MODE BUTTONS (horizontal row)                               -->
  <!-- ============================================================ -->
  <g transform="translate(0, 170)">
    <g id="mode-v" class="mode-btn" data-label="Voltage">
      <rect x="12" y="0" width="36" height="28"/>
      <text x="30" y="14" font-size="16">V</text>
    </g>

    <g id="mode-cap" class="mode-btn" data-label="Capacitance / Continuity">
      <rect x="54" y="0" width="36" height="28"/>
      <!-- Capacitor with sound waves icon -->
      <g transform="translate(72, 14)">
        <line x1="-6" y1="0" x2="-2" y2="0" stroke="#888" stroke-width="1.2"/>
        <line x1="-2" y1="-5" x2="-2" y2="5" stroke="#888" stroke-width="1.5"/>
        <path d="M2,-5 Q5,0 2,5" fill="none" stroke="#888" stroke-width="1.5"/>
        <path d="M6,-3 Q8,0 6,3" fill="none" stroke="#888" stroke-width="0.8"/>
        <path d="M9,-4 Q12,0 9,4" fill="none" stroke="#888" stroke-width="0.8"/>
      </g>
    </g>

    <g id="mode-ohm" class="mode-btn" data-label="Resistance">
      <rect x="96" y="0" width="36" height="28"/>
      <text x="114" y="14" font-size="16">Ω</text>
    </g>

    <g id="mode-diode" class="mode-btn" data-label="Diode test">
      <rect x="138" y="0" width="36" height="28"/>
      <!-- Diode symbol -->
      <g transform="translate(156, 14)">
        <polygon points="-5,-6 -5,6 5,0" fill="none" stroke="#888" stroke-width="1.2"/>
        <line x1="5" y1="-6" x2="5" y2="6" stroke="#888" stroke-width="1.2"/>
        <line x1="-9" y1="0" x2="-5" y2="0" stroke="#888" stroke-width="1"/>
        <line x1="5" y1="0" x2="9" y2="0" stroke="#888" stroke-width="1"/>
      </g>
    </g>

    <g id="mode-buzz" class="mode-btn" data-label="Continuity buzzer">
      <rect x="180" y="0" width="36" height="28"/>
      <!-- Buzzer/continuity symbol -->
      <g transform="translate(198, 14)">
        <path d="M-6,4 Q-6,-6 0,-6 Q6,-6 6,4" fill="none" stroke="#888" stroke-width="1.3"/>
        <line x1="-6" y1="4" x2="6" y2="4" stroke="#888" stroke-width="1.3"/>
        <path d="M8,-2 Q10,1 8,4" fill="none" stroke="#888" stroke-width="0.8"/>
        <path d="M10,-3 Q13,1 10,5" fill="none" stroke="#888" stroke-width="0.8"/>
      </g>
    </g>

    <g id="mode-ma" class="mode-btn" data-label="mA current">
      <rect x="222" y="0" width="36" height="28"/>
      <text x="240" y="14" font-size="13">mA</text>
    </g>

    <g id="mode-a" class="mode-btn" data-label="A current">
      <rect x="264" y="0" width="36" height="28"/>
      <text x="282" y="14" font-size="16">A</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- ⑧ STATS BAR (MAX | MEAN | MIN)                               -->
  <!-- ============================================================ -->
  <g transform="translate(0, 206)">
    <rect x="20" y="0" width="280" height="30" class="stats-box"/>
    <!-- Dividers -->
    <line x1="113" y1="2" x2="113" y2="28" class="stats-div"/>
    <line x1="206" y1="2" x2="206" y2="28" class="stats-div"/>

    <!-- MAX -->
    <text x="66" y="14" class="stats-label">MAX</text>
    <text x="66" y="26" id="stat-max-value" class="stats-value"></text>

    <!-- MEAN -->
    <text x="160" y="14" class="stats-label">MEAN</text>
    <text x="160" y="26" id="stat-mean-value" class="stats-value"></text>

    <!-- MIN -->
    <text x="253" y="14" class="stats-label">MIN</text>
    <text x="253" y="26" id="stat-min-value" class="stats-value"></text>
  </g>

</svg>
