<?xml version="1.0" encoding="UTF-8"?>
<!--
  FNIRSI 2C53T — Menu Screen SVG (switchable, landscape)
  ========================================================
  Horizontal carousel with dots at bottom. Set data-selected attribute
  to switch which menu item is highlighted.

  Usage:
    <object id="menu-screen" data="fnirsi-screen-menu.svg" type="image/svg+xml"></object>
    <script>
      function showMenuPage(mode) {
        const svg = document.getElementById('menu-screen').contentDocument;
        svg.documentElement.setAttribute('data-selected', mode);
      }
      showMenuPage('multimeter');
    </script>

  Modes: oscilloscope (default), multimeter, siggen, settings
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240"
     data-selected="oscilloscope">
  <title>FNIRSI 2C53T Menu Screen</title>

  <defs>
    <style>
      .bg { fill: #0a0e1a; }
      .box { fill: #111830; stroke: #1a2548; stroke-width: 1.5; rx: 10; }
      .box-sel { fill: #0c1428; stroke: #3af; stroke-width: 2.5;
                 filter: drop-shadow(0 0 12px rgba(51,170,255,0.4)); rx: 10; }
      .lbl { fill: #3af; font-family: Arial, Helvetica, sans-serif; font-size: 14px;
             font-weight: bold; letter-spacing: 1px; text-anchor: middle; }
      .lbl-sm { font-size: 13px; }
      .dot { fill: none; stroke: #3366aa; stroke-width: 1.5; }
      .dot-on { fill: #3af; stroke: #3af; }
      .fr { fill: #1a2040; stroke: #3a5080; stroke-width: 1; rx: 3; }
      .sc { fill: #0a1020; rx: 2; }
      .wy { stroke: #f0c040; fill: none; stroke-width: 1.5; stroke-linecap: round; }
      .wg { stroke: #40e880; fill: none; stroke-width: 1.5; stroke-linecap: round; }
      .mb { fill: #1a2040; stroke: #3a5080; stroke-width: 1; }
      .arc { fill: none; stroke: #40e880; stroke-width: 2; stroke-linecap: round; }
      .tk { stroke: #888; stroke-width: 0.8; }
      .nd { stroke: #f0c040; stroke-width: 2; stroke-linecap: round; }
      .st { fill: #1a2040; stroke: #3a5080; stroke-width: 1; rx: 2; }
      .sf { fill: #f0c040; rx: 2; }
      .sk { fill: #fff; }
      .ib { rx: 2; stroke: none; }
      .it { fill: #aaa; font-family: 'Courier New', monospace; }

      /* Visibility rules */
      .pg-osc { opacity: 1; } .pg-mm { opacity: 0; } .pg-sg { opacity: 0; } .pg-set { opacity: 0; }
      svg[data-selected="multimeter"] .pg-osc { opacity: 0; }
      svg[data-selected="multimeter"] .pg-mm  { opacity: 1; }
      svg[data-selected="siggen"]     .pg-osc { opacity: 0; }
      svg[data-selected="siggen"]     .pg-sg  { opacity: 1; }
      svg[data-selected="settings"]   .pg-osc { opacity: 0; }
      svg[data-selected="settings"]   .pg-set { opacity: 1; }
    </style>

    <!-- Reusable icons -->
    <g id="i-osc">
      <rect x="-35" y="-30" width="70" height="52" class="fr"/>
      <rect x="-30" y="-25" width="60" height="40" class="sc"/>
      <rect x="-8" y="22" width="16" height="5" fill="#3a5080" rx="1"/>
      <rect x="-14" y="27" width="28" height="3" fill="#3a5080" rx="1"/>
      <path class="wy" d="M-27,-12 Q-21,-24 -15,-12 Q-9,0 -3,-12 Q3,-24 9,-12 Q15,0 21,-12 Q27,-24 28,-12"/>
      <path class="wg" d="M-27,5 Q-21,-4 -15,5 Q-9,14 -3,5 Q3,-4 9,5 Q15,14 21,5 Q27,-4 28,5"/>
    </g>
    <g id="i-mm">
      <rect x="-32" y="-30" width="64" height="60" rx="6" class="mb"/>
      <path class="arc" d="M-22,-8 A 28,28 0 0,1 22,-8"/>
      <line x1="-22" y1="-8" x2="-19" y2="-12" class="tk"/><line x1="0" y1="-24" x2="0" y2="-28" class="tk"/>
      <line x1="22" y1="-8" x2="19" y2="-12" class="tk"/>
      <line x1="0" y1="10" x2="12" y2="-20" class="nd"/>
      <circle cx="0" cy="10" r="3" fill="#c0392b"/>
      <circle cx="-12" cy="22" r="4" fill="#c0392b"/><circle cx="12" cy="22" r="4" fill="#333"/>
    </g>
    <g id="i-sg">
      <rect x="-35" y="-30" width="70" height="42" class="fr"/>
      <rect x="-30" y="-25" width="60" height="32" class="sc"/>
      <path class="wg" d="M-27,-12 Q-21,-22 -15,-12 Q-9,-2 -3,-12 Q3,-22 9,-12 Q15,-2 21,-12 Q27,-22 28,-12"/>
      <text x="0" y="2" class="it" font-size="7" text-anchor="middle" fill="#f0c040">0000Hz</text>
      <rect x="-28" y="16" width="12" height="8" class="ib" fill="#c0392b"/>
      <rect x="-12" y="16" width="12" height="8" class="ib" fill="#2980b9"/>
      <rect x="4" y="16" width="12" height="8" class="ib" fill="#27ae60"/>
      <rect x="20" y="16" width="12" height="8" class="ib" fill="#f39c12"/>
    </g>
    <g id="i-set">
      <rect x="-30" y="-28" width="60" height="56" rx="5" class="fr"/>
      <rect x="-22" y="-18" width="44" height="6" class="st"/><rect x="-22" y="-18" width="30" height="6" class="sf"/><circle cx="8" cy="-15" r="4" class="sk"/>
      <rect x="-22" y="-4" width="44" height="6" class="st"/><rect x="-22" y="-4" width="18" height="6" class="sf"/><circle cx="-4" cy="-1" r="4" class="sk"/>
      <rect x="-22" y="10" width="44" height="6" class="st"/><rect x="-22" y="10" width="36" height="6" class="sf"/><circle cx="14" cy="13" r="4" class="sk"/>
    </g>
  </defs>

  <rect width="320" height="240" class="bg"/>

  <!-- ======== PAGE: OSCILLOSCOPE ======== -->
  <g class="pg-osc">
    <g transform="translate(-30,90)" opacity="0.5"><rect x="-45" y="-35" width="90" height="70" class="box"/><use href="#i-set" transform="scale(0.55)"/></g>
    <rect x="75" y="18" width="170" height="170" class="box-sel"/>
    <g transform="translate(160,95) scale(1.35)"><use href="#i-osc"/></g>
    <text x="160" y="175" class="lbl">Oscilloscope</text>
    <g transform="translate(350,90)" opacity="0.5"><rect x="-45" y="-35" width="90" height="70" class="box"/><use href="#i-mm" transform="scale(0.55)"/></g>
    <circle cx="130" cy="218" r="4" class="dot dot-on"/><circle cx="150" cy="218" r="4" class="dot"/>
    <circle cx="170" cy="218" r="4" class="dot"/><circle cx="190" cy="218" r="4" class="dot"/>
  </g>

  <!-- ======== PAGE: MULTIMETER ======== -->
  <g class="pg-mm">
    <g transform="translate(-30,90)" opacity="0.5"><rect x="-45" y="-35" width="90" height="70" class="box"/><use href="#i-osc" transform="scale(0.55)"/></g>
    <rect x="75" y="18" width="170" height="170" class="box-sel"/>
    <g transform="translate(160,95) scale(1.35)"><use href="#i-mm"/></g>
    <text x="160" y="175" class="lbl">Multimeter</text>
    <g transform="translate(350,90)" opacity="0.5"><rect x="-45" y="-35" width="90" height="70" class="box"/><use href="#i-sg" transform="scale(0.55)"/></g>
    <circle cx="130" cy="218" r="4" class="dot"/><circle cx="150" cy="218" r="4" class="dot dot-on"/>
    <circle cx="170" cy="218" r="4" class="dot"/><circle cx="190" cy="218" r="4" class="dot"/>
  </g>

  <!-- ======== PAGE: SIGNAL GENERATOR ======== -->
  <g class="pg-sg">
    <g transform="translate(-30,90)" opacity="0.5"><rect x="-45" y="-35" width="90" height="70" class="box"/><use href="#i-mm" transform="scale(0.55)"/></g>
    <rect x="75" y="18" width="170" height="170" class="box-sel"/>
    <g transform="translate(160,88) scale(1.35)"><use href="#i-sg"/></g>
    <text x="160" y="175" class="lbl lbl-sm">Signal Generator</text>
    <g transform="translate(350,90)" opacity="0.5"><rect x="-45" y="-35" width="90" height="70" class="box"/><use href="#i-set" transform="scale(0.55)"/></g>
    <circle cx="130" cy="218" r="4" class="dot"/><circle cx="150" cy="218" r="4" class="dot"/>
    <circle cx="170" cy="218" r="4" class="dot dot-on"/><circle cx="190" cy="218" r="4" class="dot"/>
  </g>

  <!-- ======== PAGE: SETTINGS ======== -->
  <g class="pg-set">
    <g transform="translate(-30,90)" opacity="0.5"><rect x="-45" y="-35" width="90" height="70" class="box"/><use href="#i-sg" transform="scale(0.55)"/></g>
    <rect x="75" y="18" width="170" height="170" class="box-sel"/>
    <g transform="translate(160,95) scale(1.35)"><use href="#i-set"/></g>
    <text x="160" y="175" class="lbl">Settings</text>
    <g transform="translate(350,90)" opacity="0.5"><rect x="-45" y="-35" width="90" height="70" class="box"/><use href="#i-osc" transform="scale(0.55)"/></g>
    <circle cx="130" cy="218" r="4" class="dot"/><circle cx="150" cy="218" r="4" class="dot"/>
    <circle cx="170" cy="218" r="4" class="dot"/><circle cx="190" cy="218" r="4" class="dot dot-on"/>
  </g>

</svg>
